- key: BVORERK@1#f41c7278
  doc: BVORERK
  version: '1'
  section: f41c7278
  part: null
  heading: f41c7278-b5a5-4ec3-b321-39bca5c3aeeb
  text: f41c7278-b5a5-4ec3-b321-39bca5c3aeeb Es ist systemseitig sichergestellt, dass eine Meldung mit Abgabegrund "41" nur
    erzeugt werden kann, wenn sowohl die aktuelle Arbeitsunfähigkeit als auch mindestens eine vorherige Arbeitsunfähigkeit
    attestiert sind.
  page: null
  field: null
- key: BVORERK@1#0cefe80e
  doc: BVORERK
  version: '1'
  section: 0cefe80e
  part: null
  heading: 0cefe80e-4fd9-41e1-be4f-3ae1ecbde646
  text: 0cefe80e-4fd9-41e1-be4f-3ae1ecbde646 Es ist maschinell sichergestellt, dass die Meldung mit Abgabegrund "41" nur erzeugt
    werden kann, wenn zwischen dem Beginn der aktuellen Arbeitsunfähigkeit und dem Ende der letzten attestierten Arbeitsunfähigkeit
    nicht mehr als 6 Monate liegen.
  page: null
  field: null
- key: BVORERK@1#aade0289
  doc: BVORERK
  version: '1'
  section: aade0289
  part: null
  heading: aade0289-e8f9-4e12-9c49-464cf6cd0789
  text: aade0289-e8f9-4e12-9c49-464cf6cd0789 = Daumenkriterium AU-Zeiten vor Beginn der aktuellen Arbeitsunfähigkeit werden
    nur dann in die Meldung mit Abgabegrund "41" aufgenommen, wenn jeweils zwischen dem Beginn einer AU-Zeit und dem Ende
    der vorhergehenden AU-Zeit nicht mehr als 6 Monate liegen.
  page: null
  field: null
- key: BVORERK@1#9c8c9b58
  doc: BVORERK
  version: '1'
  section: 9c8c9b58
  part: null
  heading: 9c8c9b58-4d0f-4066-98ac-973095418d63
  text: 9c8c9b58-4d0f-4066-98ac-973095418d63 Es ist systemseitig sichergestellt, dass eine Meldung mit Abgabegrund "41" nur
    erzeugt werden kann, wenn die systemseitig vorliegenden Vorerkrankungszeiten zusammen mit der aktuellen AU-Zeit mindestens
    30 Tage umfassen.
  page: null
  field: null
