  heading: 13.2 Mehrere Vorerkrankungen
  text: 'Sachverhalt: Di. 01.06.20XX – Do. 25.06.20XX Mo. 03.05.20XX – Do. 06.05.20XX Wie 12.1, jedoch folgende vorherige
    Do. 01.10.20YY – Mi. 28.10.20YY Arbeitsunfähigkeiten: Abgabegrund 41 - Anforderung Vorerkrankungsmitteilungen DBVO – Datenbaustein
    Vorerkrankungszeiten Feld Inhalt Bemerkungen GRUNDAV 1 AU-AB-AG 20XX0831 AU-AB-SV 00000000 KZ-AK-AU 0 12-MONATSFRIST-AB
    00000000 ANZAHL-AU 2 BEGINN-AU-1 20XX0601 ENDE-AU-1 20XX0625 KZ-NACHWEIS 1 0 TEIL-NACHWEIS-AU- 00000000 BEGINN-1 TEIL-NACHWEIS-AU-
    00000000 ENDE-1 KZ-AU 1 0 TEIL-ANR-AU-BEGINN-1 00000000 TEIL-ANR-AU-ENDE-1 00000000 BEGINN-AU-2 20XX0503 ENDE-AU-2 20XX0506
    KZ-NACHWEIS 1 0 TEIL-NACHWEIS-AU- 00000000 BEGINN-1 TEIL-NACHWEIS-AU- 00000000 ENDE-1 KZ-AU 1 0 TEIL-ANR-AU-BEGINN-1 00000000
