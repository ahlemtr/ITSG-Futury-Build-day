passages:
- key: VB@13.3#3.12
  doc: VB
  version: '13.3'
  section: '3.12'
  part: null
  heading: 3.12 Datenbaustein DBVO – Vorerkrankungszeiten
  text: Die Vorerkrankungsanfrage (3.1.18 „Abgabegrund“ = „41“) darf nur dann durch den Arbeitgeber ausgelöst werden, wenn
    • dem Arbeitgeber für die aktuelle Arbeitsunfähigkeit eine Arbeitsunfähigkeitsbescheinigung vorliegt, • zusätzlich in
    den letzten 6 Monaten vor Beginn der aktuellen Arbeitsunfähigkeit mindestens eine bescheinigte potentielle Vorerkrankung
    in Bezug auf die aktuelle Arbeitsunfähigkeit im Datenbestand vorliegt und • die kumulierten Zeiten aller potentiellen
    Vorerkrankungen in den letzten 12 Monaten zusammen mit der aktuellen Arbeitsunfähigkeit zum Zeitpunkt der Meldung mindestens
    30 Tage umfassen. Werden im Entgeltabrechnungssystem die Fehlzeiten mit einem offenen Ende verwaltet, ist zur Prüfung
    der Frist die AU mit einer Dauer von einer Woche in die Zukunft ab dem Tagesdatum zu beurteilen. Als „bescheinigte“ Arbeitsunfähigkeitszeiten
    gelten auch die im elektronischen Arbeitsunfähigkeitsverfahren übermittelten Datensätze. Bei der Anfrage sollen durch
    den Arbeitgeber möglichst alle potentiellen Vorerkrankungen angegeben werden, es muss mindestens eine Vorerkrankung angegeben
    sein. Es ist daher nicht erforderlich, dass die übermittelten kumulierten Zeiten aller potentiellen Vorerkrankungen zusammen
    mit der aktuellen Arbeitsunfähigkeit mindestens 30 Tage umfassen, systemseitig müssen jedoch weiterhin zusammen mit der
    aktuellen Arbeitsunfähigkeit zum Zeitpunkt der Meldung mindestens 30 Tage vorliegen. Dies bedeutet, dass möglichst alle
    Vorerkrankungen übermittelt werden, bei welchen zwischen dem Ende der vorhergehenden Erkrankung und dem Beginn der nachgehenden
    Erkrankung nicht mindestens 6 Monate vergangen sind. Hierbei ist bis zur erstmalig bescheinigten Erkrankung zurückzugehen
    (hierfür gilt keine zeitliche Begrenzung), welche keine Vorerkrankung innerhalb von 6 Monaten aufweist. Sofern der Arbeitnehmer
    aufgrund der Regelung im Entgeltfortzahlungsgesetz sich ohne Arbeitsunfähigkeitsbescheinigung krankgemeldet hat, kann
    die Krankenkasse keine Beurteilung auf Anrechnung als Vorerkrankung vornehmen, da ihr keine Daten vorliegen. Schließt
    sich keine bescheinigte Arbeitsunfähigkeit nahtlos an diese Zeiten an (Kurz-Arbeitsunfähigkeit), sind diese Zeiten nicht
    als potentielle Vorerkrankung zu übermitteln. Der Arbeitgeber stellt eine „Vorerkrankungsanfrage“ bei gesetzlich krankenversicherten
    Arbeitnehmern im elektronischen Datenaustausch, unabhängig vom Grund der Abwesenheit (Unfall, Krankheit, Rehabilitation
    etc.), bei der für die aktuelle Abwesenheit zuständigen gesetzlichen Krankenkasse. Die Abwesenheiten werden im Zusammenhang
    mit einer Vorerkrankungsprüfung einer Arbeitsunfähigkeit gleichgestellt, weshalb im Weiteren ausschließlich von Arbeitsunfähigkeitszeiten
    gesprochen wird. Dabei kommt es nicht darauf an, ob die Versicherung des Arbeitnehmers einen Anspruch auf Krankengeld
    einschließt. Die Anfrage ist vor dem Versand jeweils individuell durch den Arbeitgeber auf Sinnhaftigkeit zu prüfen. Sofern
    der Arbeitnehmer privat krankenversichert oder geringfügig beschäftigt ist, ist eine Vorerkrankungsanfrage im Rahmen des
    DTA EEL nicht möglich. Vorerkrankungsanfragen im Zusammenhang mit einer Berufskrankheit oder einem Arbeitsunfall für privat
    krankenversicherte Arbeitnehmende sind durch den Arbeitgeber außerhalb des Verfahrens direkt an die zuständige Berufsgenossenschaft
    zu richten (Anlage 3 GG). Die genannten Ausnahmen vom Verfahren sind abschließend. Die Rückmeldung durch die Krankenkasse
    beinhaltet mindestens die vom Arbeitgeber gemeldeten Arbeitsunfähigkeiten. Stellt die Krankenkasse bei der Prüfung weitergehende
    relevante Arbeitsunfähigkeiten fest, werden diese entsprechend hinzugefügt. Relevant für die Beurteilung der Anrechenbarkeit
    von Vorerkrankungen sind alle Erkrankungen, bei welchen zwischen dem Ende der vorhergehenden Erkrankung und dem Beginn
    der nachgehenden Erkrankung nicht mindestens 6 Monate vergangen sind. Hierbei ist bis zur erstmalig bescheinigten Erkrankung
    zurückzugehen (jedoch maximal innerhalb der letzten 12 Monate), welche keine Vorerkrankung innerhalb von 6 Monaten aufweist.
    Sofern der Arbeitnehmer aufgrund der Regelung im Entgeltfortzahlungsgesetz sich ohne Arbeitsunfähigkeitsbescheinigung
    krankgemeldet hat, kann die Krankenkasse diese Zeiten bei der Beurteilung auf Anrechnung als Vorerkrankung nicht berücksichtigen.
    Auswirkungen vorhergehender Erkrankungen aufgrund derselben Erkrankung auf die Entgeltfortzahlung für die aktuelle Arbeitsunfähigkeit
    können durch die Angabe der maßgebenden 12-Monatsfrist unter 3.12.5 „Beginn der maßgebenden 12-Monatsfrist“ nachvollzogen
    werden. Erfolgt die Meldung durch den Arbeitgeber für GKV-Versicherte Arbeitnehmer im Zusammenhang mit Übergangsgeld (3.1.18
    „Abgabegrund“ = „11“, „12“) und die Dauer der Entgeltfortzahlung wurde aufgrund von anrechenbaren Vorerkrankungen verkürzt
    (3.4.3 „Weitergezahltes Arbeitsentgelt bei AU/Mitaufnahme Krhs./med. Leist./LTA bis“ < 6 Wochen), ist der DBVO durch den
    Arbeitgeber für Zeiten der Mitgliedschaft in einer gesetzlichen Krankenversicherung nur mit den durch die Krankenkassen
    mit 3.1.18 „Abgabegrund“ = „61“ unter 3.12.12 „Kennzeichen Arbeitsunfähigkeit „nn““ als „1“ = „anrechenbar“ festgestellten
    Zeiträumen der Vorerkrankungen zu übermitteln. Wurden von der Krankenkasse an den Arbeitgeber mit 3.1.18 „Abgabegrund“
    = „61“ Zeiten unter 3.12.12 „Kennzeichen Arbeitsunfähigkeit „nn““ als „5“ = „teilweise anrechenbar“ zurückgemeldet, sind
    dem Rentenversicherungsträger ebenfalls nur die anrechenbaren Teilzeiträume in den Feldern 3.12.7 „Arbeitsunfähigkeit
    Zeitraum-Beginn „nn““ und 3.12.8 „Arbeitsunfähigkeit Zeitraum-Ende „nn““ zu übermitteln. Das Kennzeichen 3.12.12 „Kennzeichen
    Arbeitsunfähigkeit „nn““ ist in dem Fall mit „1“ = „anrechenbar“ zu füllen und die Felder 3.12.13 „Teilweise anrechenbare
    Arbeitsunfähigkeit Zeitraum-Beginn-„nn““ und 3.12.14 „Teilweise anrechenbare Arbeitsunfähigkeit Zeitraum-Ende-„nn“ mit
    Grundstellung zurückzumelden.
  page: null
  field: null
