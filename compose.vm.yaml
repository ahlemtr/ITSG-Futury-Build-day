# VM deployment: docker compose -f compose.vm.yaml ...
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eel
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U eel -d eel']
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:7474/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  graph-init:
    build: .
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgresql://eel:${POSTGRES_PASSWORD}@postgres:5432/eel
      NEO4J_URI: bolt://neo4j:7687
      KG_BACKEND: graph
      DATA_DIR: /app/data
      SEED_ON_START: "0"
    command: [python, -m, kg.build]
    volumes: &app-volumes
      - app_data:/app/data
      - kg_build:/app/kg/build
      - source_uploads:/app/sources/uploads
    depends_on:
      neo4j:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      SEED_ON_START: "1"
    volumes: *app-volumes
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      graph-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=5)']
      interval: 10s
      timeout: 8s
      retries: 12

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    restart: unless-stopped
    ports:
      - '${APP_PORT:-31080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  neo4j_data:
  app_data:
  kg_build:
  source_uploads:
