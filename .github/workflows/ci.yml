name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  ui:
    name: ui (build, i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:i18n

  graph:
    name: graph (Neo4j tests)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password
          NEO4J_PLUGINS: '["apoc"]'
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password
      NEO4J_TESTS: "1"
      SPEC_BASELINE: ""  # the full seed (VB 13.3 + 13.4), as the tests expect
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build and load the full graph (no paid embeddings)
        run: uv run python -m kg.build --skip-embed
      - run: uv run pytest -q tests/test_kg.py
