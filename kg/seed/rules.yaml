  # --- GG Anlage 2: Schlüsselzahlen (kg/seed/key_values.yaml), all message types
  - id: S-1
    title: Codes are Schlüsselzahlen of GG Anlage 2
    description: >-
      A filled code field (ABGABEGRUND, KORR-ABGABEGRUND, GRUNDBEEND, FEHLZEIT, EEL-ENDE-GRUND,
      ABRECHNUNGSPROGRAMM, MM-KUG, ENTGART, KEINEFREIST, GRUNDAV, KZ-NACHWEIS, KZ-AU) carries one of the codes
      of GG Anlage 2. Whether a field must be filled is checked elsewhere; Grundstellung is not judged here.
    kind: format
    status: approved
    criterion: null
    applies_to: ["01", "41", "61", "62", "88"]
    fields: [DSLW.ABGABEGRUND, DSLW.KORR-ABGABEGRUND, DSLW.ABRECHNUNGSPROGRAMM, DBAL.GRUNDBEEND, DBAL.MM-KUG,
             DBAE.ENTGART, DBEE.EEL-ENDE-GRUND, DBVO.GRUNDAV, DBVO.KZ-NACHWEIS, DBVO.KZ-AU]
    params: []
    sources: [GG-ANL2@13.0#2, GG-ANL2@13.0#3, GG-ANL2@13.0#5, GG-ANL2@13.0#6, GG-ANL2@13.0#7, GG-ANL2@13.0#8,
