    applies_to: ["01", "02", "03", "04", "11", "12", "21", "22", "23", "31"]
    fields: []
    params: []
    sources: [VB-ANL3@13.3#3]
  - id: A3-3
    title: "direkt aufeinanderfolgende Leistungen: neue Entgeltbescheinigung nur, wo VB Anlage 3 es vorsieht"
    description: >-
      Folgt eine zweite Leistung direkt auf die erste, entscheidet die Tabelle in VB Anlage 3 Kapitel 3 (§ 69 SGB
      IX), ob der Arbeitgeber eine neue Meldung erstattet (z. B. Krankengeld, dann Mutterschaftsgeld: ja;
      Übergangsgeld, dann Krankengeld: nein; Kinderkrankengeld für dasselbe Kind: nein, für ein anderes Kind: ja).
    kind: chain
    family: common
    status: approved
    criterion: null
    applies_to: ["01", "02", "03", "04", "11", "12", "21", "22", "23", "31"]
    fields: []
    params: []
    sources: [VB-ANL3@13.3#3]

