    description: >-
      Liegt mindestens ein Kalendertag (auch arbeitsfreie Tage) zwischen zwei Leistungszeiträumen, erstattet der
      Arbeitgeber für den zweiten stets eine neue Meldung (VB Anlage 3 Kapitel 3).
