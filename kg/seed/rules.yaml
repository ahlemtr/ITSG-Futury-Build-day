  - id: F41-8
    title: "AU-Zeiten absteigend, jüngste zuerst"
    description: >-
      Die AU-Zeiten im DBVO stehen absteigend, die jüngste zuerst (VB 3.12.7).
    kind: format
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: []
