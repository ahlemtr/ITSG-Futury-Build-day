# Rules of the engine. One card per rule; the code that checks it:
#   family common        -> engine/rules/ (common.py, blocks.py, continuity.py): every message, every family
#   family vorerkrankung -> engine/families/vorerkrankung/ (rules.py decides and computes, chain.py builds the
#                           expected messages, checks.py checks the vendor's messages and names the rule)
# `kind` sets the label of a broken rule: format -> invalid, every other kind -> bug.
# Sources cite the narrowest passage, in both VB versions where the text exists in both.
# BP, HINWEISE and BVORERK sources are optional: dropped with a warning if the file is missing.
# IDs are permanent: a retired ID is never reused. Retired 2026-11-03 (meaning moved to):
#   F41-1 (could never fail), F41-2 -> S-2, F41-3 -> A3-1, F41-9 -> F41-6, F41-10 -> S-3, C-4 -> C-3,
#   C-5 -> E-2, C-6 -> K62-2, C-7 -> K61-9, C-8 -> A3-1, A3-3 -> A3-2.
all_messages: &all ["01", "02", "03", "04", "11", "12", "21", "22", "23", "31", "41", "42", "51", "61", "62", "66",
                    "67", "71", "72", "73", "88", "99"]
benefit_certificates: &certificates ["01", "02", "03", "04", "11", "12", "21", "22", "23", "31"]
rules:
  # ======================================================== common: every message, every family

  # --- GG Anlage 2: Schlüsselzahlen (kg/seed/key_values.yaml)
  - id: S-1
    title: "Schlüsselzahlen nach GG Anlage 2"
    description: >-
      Ein gefülltes Schlüsselfeld (ABGABEGRUND, KORR-ABGABEGRUND, GRUNDBEEND, FEHLZEIT, EEL-ENDE-GRUND,
      ABRECHNUNGSPROGRAMM, MM-KUG, ENTGART, KEINEFREIST, GRUNDAV, KZ-NACHWEIS, KZ-AU) enthält eine Schlüsselzahl
      aus GG Anlage 2. Ob ein Feld gefüllt sein muss, prüfen andere Regeln; Grundstellung wird hier nicht
      bewertet.
    kind: format
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DSLW.ABGABEGRUND, DSLW.KORR-ABGABEGRUND, DSLW.ABRECHNUNGSPROGRAMM, DBAL.GRUNDBEEND, DBAL.MM-KUG,
             DBAE.ENTGART, DBEE.EEL-ENDE-GRUND, DBVO.GRUNDAV, DBVO.KZ-NACHWEIS, DBVO.KZ-AU]
    params: []
    sources: [GG-ANL2@13.0#2, GG-ANL2@13.0#3, GG-ANL2@13.0#5, GG-ANL2@13.0#6, GG-ANL2@13.0#7, GG-ANL2@13.0#8,
              GG-ANL2@13.0#10, GG-ANL2@13.0#11, GG-ANL2@13.0#12]
  - id: S-2
    title: "KORR-ABGABEGRUND = 00, außer bei Abgabegrund 66"
    description: >-
      DSLW.KORR-ABGABEGRUND nennt nur in der Rückmeldung 66 (falscher Abgabegrund) den korrekten Abgabegrund; in
      jeder Meldung des Arbeitgebers und jeder anderen Rückmeldung ist nur Grundstellung 00 zulässig, auch in
      der Stornierung 88 (VB 3.1.19, Beispielpapier 23).
    kind: format
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DSLW.KORR-ABGABEGRUND]
    params: []
    sources: [VB@13.3#3.1.19, VB@13.4#3.1.19, BP@13.2#23, BP@13.3#23]
  - id: S-3
    title: "DATENSATZ-ID im Format 8-4-4-4-12"
    description: >-
      DSLW.DATENSATZ-ID ist hexadezimal im Format 8-4-4-4-12 (ohne Prüfung der RFC-4122-Version: ITSG-eigene IDs
      wie 11111111-2222-AAAA-EEEE-111111111111 würden sonst abgelehnt). Dass jede Meldung eine andere hat: C-1.
    kind: format
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DSLW.DATENSATZ-ID]
    params: []
    sources: [VB@13.3#3.1.11, VB@13.4#3.1.11]

  # --- VB Anlage 3 chapter 2: data blocks per Abgabegrund (kg/seed/message_types.yaml block_table)
  - id: A3-1
    title: "Datenbausteine nach VB Anlage 3, MM-Kennzeichen passend"
    description: >-
      Jeder Abgabegrund enthält die Datenbausteine, die VB Anlage 3 Kapitel 2 mit J kennzeichnet, und keinen mit
      N (die 88 zum Beispiel nur den DBSD). Datenbausteine mit m werden nur bei entsprechendem Sachverhalt
      übermittelt; ob der Sachverhalt vorliegt, entscheiden die Regeln der Fallgruppe oder ein Systemberater.
      Jedes MM-Kennzeichen im DSLW ist genau dann J, wenn sein Datenbaustein vorhanden ist (VB 3.1).
    kind: format
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DSLW.MM-NAME, DSLW.MM-ANSCHRIFT, DSLW.MM-ALLGEMEIN, DSLW.MM-ENTGELT, DSLW.MM-VOER, DSLW.MM-EELENDE,
             DSLW.MM-ANSPRECH, DSLW.MM-ID, DSLW.MM-SD]
    params: []
    sources: [VB-ANL3@13.3#2, VB-ANL3@13.3#2.2, VB@13.3#3.1, VB@13.4#3.1, BP@13.2#13.1, BP@13.3#13.1, BP@13.2#23,
              BP@13.3#23]

  # --- the employer's messages of one case, taken together
  - id: C-1
    title: "jede Meldung des Falls hat eine andere DATENSATZ-ID"
    description: >-
      DSLW.DATENSATZ-ID ist in jeder Meldung des Arbeitgebers eine andere: eine wiederverwendete ID macht die
      Datei nicht ungültig, verwechselt aber Meldungen (Format der ID: S-3).
    kind: chain
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DSLW.DATENSATZ-ID]
    params: []
    sources: [VB@13.3#3.1.11, VB@13.4#3.1.11]
  - id: C-2
    title: "AKTENZEICHEN-VERURSACHER in allen Meldungen des Arbeitgebers zum Fall gleich"
    description: >-
      Das AKTENZEICHEN-VERURSACHER ist in allen Meldungen des Arbeitgebers zum Fall gleich (DBID, in der 88 der
      DBSD).
    kind: chain
    family: common
    status: approved
    criterion: null
    applies_to: *all
    fields: [DBID.AKTENZEICHEN-VERURSACHER, DBSD.AKTENZEICHEN-VERURSACHER]
    params: []
    sources: [VB@13.3#3.19.2, VB@13.4#3.19.2, VB@13.3#3.20, VB@13.4#3.20]
  - id: C-3
    title: "die 88 nennt die stornierte Meldung: DATENSATZ-ID und Namen wie dort"
    description: >-
      DBSD.DATENSATZ-ID-URSPRUNGSMELDUNG der 88 ist die DATENSATZ-ID einer früheren Meldung des Falls;
      DBSD.VORNAME und DBSD.FAMILIENNAME sind die Namen in dieser Meldung (GG 2.5, VB 3.20). Welche Meldung zu
      stornieren ist, sagen die Regeln der Fallgruppe (Vorerkrankung: E-2).
    kind: chain
    family: common
    status: approved
    criterion: null
    applies_to: ["88"]
    fields: [DBSD.DATENSATZ-ID-URSPRUNGSMELDUNG, DBSD.VORNAME, DBSD.FAMILIENNAME]
    params: []
    sources: [VB@13.3#3.20, VB@13.4#3.20, GG@13.1#2.5]

  # --- VB Anlage 3 chapter 3: continuity of benefits, § 69 SGB IX (kg/seed/continuity.yaml); used from G4 on
  - id: A3-2
    title: "Leistungswechsel: neue Entgeltbescheinigung nach VB Anlage 3 Kapitel 3"
    description: >-
      Liegt mindestens ein Kalendertag (auch arbeitsfreie Tage) zwischen zwei Leistungen, erstattet der
      Arbeitgeber für die zweite stets eine neue Meldung. Folgt die zweite direkt auf die erste, entscheidet die
      Tabelle in VB Anlage 3 Kapitel 3 (§ 69 SGB IX), z. B. Krankengeld, dann Mutterschaftsgeld: ja;
      Übergangsgeld, dann Krankengeld: nein; Kinderkrankengeld für dasselbe Kind: nein, für ein anderes Kind: ja.
    kind: continuity
    family: common
    status: approved
    criterion: null
    applies_to: *certificates
    fields: []
    params: []
    sources: [VB-ANL3@13.3#3]

  # ======================================================== vorerkrankung (VB 3.12)

  # --- when must the employer send a 41, and with which periods?
  - id: R41-1
    title: "41 nur, wenn die aktuelle AU und mindestens eine Vorerkrankung attestiert sind"
    description: >-
      Eine 41 darf nur erzeugt werden, wenn sowohl die aktuelle Arbeitsunfähigkeit als auch mindestens eine
      vorherige Arbeitsunfähigkeit attestiert sind (AU-Bescheinigung: eAU oder Papier beim Arbeitgeber).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: f41c7278-b5a5-4ec3-b321-39bca5c3aeeb
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BVORERK@1#f41c7278]
  - id: R41-2
    title: "Abstand zwischen Beginn der aktuellen AU und Ende der letzten Vorerkrankung höchstens gap_months"
    description: >-
      Beginn der aktuellen AU minus Ende der letzten Vorerkrankung ist höchstens gap_months. Mit gap_inclusive =
      true (13.4) wird ein Abstand von genau 6 Monaten (nächster Beginn = Ende + 6 Monate) noch verkettet, mit
      false (13.3) nicht.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 0cefe80e-4fd9-41e1-be4f-3ae1ecbde646
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, BVORERK@1#0cefe80e]
  - id: R41-3
    title: "Kette zurück, solange der Abstand zur nächsten AU höchstens gap_months beträgt (Daumenkriterium)"
    description: >-
      Kette zurück: eine Vorerkrankung wird nur aufgenommen, solange der Abstand zur nächsten AU höchstens
      gap_months beträgt (Daumenkriterium), ohne zeitliche Grenze. Jüngste zuerst; Ende beim ersten Abstand über
      gap_months.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: aade0289-e8f9-4e12-9c49-464cf6cd0789
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, VB@13.3#3.12.7, VB@13.4#3.12.7, BP@13.2#13.2, BP@13.3#13.2, BVORERK@1#aade0289]
  - id: R41-4
    title: "Vorerkrankungstage der letzten sum_window_months plus Tage der aktuellen AU mindestens min_total_days"
    description: >-
      Die Vorerkrankungstage der letzten sum_window_months zusammen mit den Tagen der aktuellen AU umfassen
      mindestens min_total_days.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 9c8c9b58-4d0f-4066-98ac-973095418d63
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [min_total_days, sum_window_months]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.2#13.4, BP@13.3#13.4, BVORERK@1#9c8c9b58]
  - id: R41-5
    title: "nicht attestierte Kurzerkrankungen (Kurz-AU) werden nie angegeben"
    description: >-
      Nicht attestierte Kurzerkrankungen (Kurz-AU) werden nie angegeben, außer eine attestierte AU schließt
      nahtlos an (dann gehören sie zu ihr; Angabe offen, ITSG-Frage 5). Nur attestierte AU-Zeiten gehören in die
      41 (Pflichtenheft-Kriterium a4770b2b).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: a4770b2b-0da5-46bc-baf1-a86472054ca2
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: []
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining]
  - id: R41-6
    title: "offenes Ende der aktuellen AU zählt bis Tagesdatum der Meldung + open_end_days - 1"
    description: >-
      Eine aktuelle AU mit offenem Ende zählt bis Tagesdatum der Meldung + open_end_days - 1 (eine Woche
      einschließlich des Meldedatums, Beispielpapier 13.5: 02.09. bis 08.09.). Das Pflichtenheft-Kriterium nennt
      "Tagesdatum zzgl. 7 Tage" (Widerspruch 3, ITSG-Frage 11).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: ac3b56af-98ca-4fe4-88cf-88ee685e52c9
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: [open_end_days]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.2#13.5, BP@13.3#13.5]
  - id: R41-7
    title: "die 41 geht an die Krankenkasse der versicherten Person"
    description: >-
      Empfänger der 41 ist die Betriebsnummer der Krankenkasse, bei der die beschäftigte Person gesetzlich
      versichert ist (Pflichtenheft 2026.2, DBVO Kriterium 1). Wer keine 41 erhält: R41-8.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 91e32e04-a608-4a04-82ef-83f021be4505
    applies_to: ["41"]
    fields: [DSLW.EMPFAENGERNUMMER, DSLW.BBNR-KK]
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions]
  - id: R41-8
    title: "keine 41 für privat Krankenversicherte und geringfügig Beschäftigte (Personengruppe 109, 110)"
    description: >-
      Für privat Krankenversicherte und geringfügig Beschäftigte mit Personengruppenschlüssel 109 oder 110 kann
      keine 41 erstellt werden (Pflichtenheft 2026.2, DBVO Kriterium 2).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: bcec54ad-235c-4ad1-9058-9d5460cf9f88
    applies_to: ["41"]
    fields: []
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions]

