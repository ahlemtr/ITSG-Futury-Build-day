    kind: format
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["41"]
    fields: [DBVO.AU-AB-SV, DBVO.KZ-AK-AU, DBVO.12-MONATSFRIST-AB, DBVO.KZ-NACHWEIS, DBVO.TEIL-NACHWEIS-AU-BEGINN,
             DBVO.TEIL-NACHWEIS-AU-ENDE, DBVO.KZ-AU, DBVO.TEIL-ANR-AU-BEGINN, DBVO.TEIL-ANR-AU-ENDE]
    params: []
    sources: [VB@13.3#3.12.3, VB@13.4#3.12.3, VB@13.3#3.12.4, VB@13.4#3.12.4, VB@13.3#3.12.5, VB@13.4#3.12.5,
              VB@13.3#3.12.9, VB@13.4#3.12.9, VB@13.3#3.12.12, VB@13.4#3.12.12]
  - id: F41-7
    title: "ANZAHL-AU = Anzahl der AU-Zeiten, mindestens 1"
    description: >-
      DBVO.ANZAHL-AU = Anzahl der AU-Zeiten, mindestens 1.
    kind: format
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["41"]
