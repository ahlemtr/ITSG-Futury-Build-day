  # --- EFZ end after a 61
  - id: E-1
    title: the 01 carries DBAL.DATUM-EGZBIS = efz_end
    description: >-
      The 01 certificate carries DBAL.DATUM-EGZBIS = efz_end, where efz_end = current start +
      (efz_days - used - 1) days and used counts the periods the 61 marks as counting.
    kind: efz
    status: approved
    criterion: null
    applies_to: ["01"]
    fields: [DBAL.DATUM-EGZBIS]
    params: [efz_days]
    sources: [VB@13.3#3.4.3, VB@13.4#3.4.3, HINWEISE@1#chain]
  - id: E-2
    title: a corrected 61 that changes efz_end requires 88 + new 01
    description: A corrected 61 that changes efz_end requires an 88 (cancel the old 01) and a new 01.
    kind: efz
    status: approved
    criterion: null
    applies_to: ["01", "88"]
    fields: [DBAL.DATUM-EGZBIS, DBSD.DATENSATZ-ID-URSPRUNGSMELDUNG]
    params: [efz_days]
    sources: [GG@13.1#2.5, BP@13.3#23]
  - id: E-3
    title: an update only in interim flags 3 or 4 does not cancel the earlier 61
    description: >-
      An updated 61 whose only change is in interim flags 3 or 4 (KZ-AK-AU, KZ-AU-nn) does not cancel
      the earlier 61.
    kind: efz
    status: approved
    criterion: null
    applies_to: ["61"]
    fields: [DBVO.KZ-AK-AU, DBVO.KZ-AU]
    params: []
    sources: [VB@13.3#3.12.4, VB@13.4#3.12.4, VB@13.3#3.12.12, VB@13.4#3.12.12]

