# Rules of the engine.
# Sources cite the narrowest passage, in both VB versions where the text exists in both.
# BP, HINWEISE and BVORERK sources are optional: dropped with a warning if the file is missing.
rules:
  # --- when must the employer send a 41?
  - id: R41-1
    title: "41 nur, wenn die aktuelle AU und mindestens eine Vorerkrankung attestiert sind"
    description: >-
      Eine 41 darf nur erzeugt werden, wenn sowohl die aktuelle Arbeitsunfähigkeit als auch mindestens eine
      vorherige Arbeitsunfähigkeit attestiert sind (AU-Bescheinigung: eAU oder Papier beim Arbeitgeber).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: f41c7278-b5a5-4ec3-b321-39bca5c3aeeb
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BVORERK@1#f41c7278]
  - id: R41-2
    title: "Abstand zwischen Beginn der aktuellen AU und Ende der letzten Vorerkrankung höchstens gap_months"
    description: >-
      Beginn der aktuellen AU minus Ende der letzten Vorerkrankung ist höchstens gap_months. Mit gap_inclusive =
      true (13.4) wird ein Abstand von genau 6 Monaten (nächster Beginn = Ende + 6 Monate) noch verkettet, mit
      false (13.3) nicht.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 0cefe80e-4fd9-41e1-be4f-3ae1ecbde646
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, BVORERK@1#0cefe80e]
  - id: R41-3
    title: "Kette zurück, solange der Abstand zur nächsten AU höchstens gap_months beträgt (Daumenkriterium)"
    description: >-
      Kette zurück: eine Vorerkrankung wird nur aufgenommen, solange der Abstand zur nächsten AU höchstens
      gap_months beträgt (Daumenkriterium), ohne zeitliche Grenze. Jüngste zuerst; Ende beim ersten Abstand über
      gap_months.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: aade0289-e8f9-4e12-9c49-464cf6cd0789
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, VB@13.3#3.12.7, VB@13.4#3.12.7, BP@13.2#13.2, BP@13.3#13.2, BVORERK@1#aade0289]
  - id: R41-4
    title: "Vorerkrankungstage der letzten sum_window_months plus Tage der aktuellen AU mindestens min_total_days"
    description: >-
      Die Vorerkrankungstage der letzten sum_window_months zusammen mit den Tagen der aktuellen AU umfassen
      mindestens min_total_days.
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 9c8c9b58-4d0f-4066-98ac-973095418d63
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [min_total_days, sum_window_months]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.2#13.4, BP@13.3#13.4, BVORERK@1#9c8c9b58]
  - id: R41-5
    title: "nicht attestierte Kurzerkrankungen (Kurz-AU) werden nie angegeben"
    description: >-
      Nicht attestierte Kurzerkrankungen (Kurz-AU) werden nie angegeben, außer eine attestierte AU schließt
      nahtlos an (dann gehören sie zu ihr; Angabe offen, ITSG-Frage 5). Nur attestierte AU-Zeiten gehören in die
      41 (Pflichtenheft-Kriterium a4770b2b).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: a4770b2b-0da5-46bc-baf1-a86472054ca2
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: []
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining]
  - id: R41-6
    title: "offenes Ende der aktuellen AU zählt bis Tagesdatum der Meldung + open_end_days - 1"
    description: >-
      Eine aktuelle AU mit offenem Ende zählt bis Tagesdatum der Meldung + open_end_days - 1 (eine Woche
      einschließlich des Meldedatums, Beispielpapier 13.5: 02.09. bis 08.09.). Das Pflichtenheft-Kriterium nennt
      "Tagesdatum zzgl. 7 Tage" (Widerspruch 3, ITSG-Frage 11).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: ac3b56af-98ca-4fe4-88cf-88ee685e52c9
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: [open_end_days]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.2#13.5, BP@13.3#13.5]

  - id: R41-7
    title: "41 nur für gesetzlich Krankenversicherte, an deren Krankenkasse"
    description: >-
      Eine 41 wird nur für gesetzlich Krankenversicherte erzeugt; Empfänger ist die Betriebsnummer der
      Krankenkasse, bei der die beschäftigte Person versichert ist (Pflichtenheft 2026.2, DBVO Kriterium 1).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: 91e32e04-a608-4a04-82ef-83f021be4505
    applies_to: ["41"]
    fields: [DSLW.EMPFAENGERNUMMER, DSLW.BBNR-KK]
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions]
  - id: R41-8
    title: "keine 41 für privat Krankenversicherte und geringfügig Beschäftigte (Personengruppe 109, 110)"
    description: >-
      Für privat Krankenversicherte und geringfügig Beschäftigte mit Personengruppenschlüssel 109 oder 110 kann
      keine 41 erstellt werden (Pflichtenheft 2026.2, DBVO Kriterium 2).
    kind: domain
    family: vorerkrankung
    status: approved
    criterion: bcec54ad-235c-4ad1-9058-9d5460cf9f88
    applies_to: ["41"]
    fields: []
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions]

