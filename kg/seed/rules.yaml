  # --- EFZ end after a 61
  - id: E-1
    title: "die 01 enthält DBAL.DATUM-EGZBIS = Ende der EFZ"
    description: >-
      Die Entgeltbescheinigung 01 enthält DBAL.DATUM-EGZBIS = Ende der EFZ; Ende der EFZ = Beginn der aktuellen AU
      + (efz_days - angerechnete Tage - 1) Tage, angerechnet werden die Zeiten, die die 61 als anrechenbar
      kennzeichnet.
    kind: efz
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["01"]
    fields: [DBAL.DATUM-EGZBIS]
    params: [efz_days]
    sources: [VB@13.3#3.4.3, VB@13.4#3.4.3, HINWEISE@1#chain]
  - id: E-2
    title: "ändert eine korrigierte 61 das Ende der EFZ, folgen 88 und neue 01"
    description: >-
      Ändert eine korrigierte 61 das Ende der EFZ, wird die alte 01 mit einer 88 storniert und eine neue 01
      gesendet.
    kind: efz
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["01", "88"]
    fields: [DBAL.DATUM-EGZBIS, DBSD.DATENSATZ-ID-URSPRUNGSMELDUNG]
    params: [efz_days]
    sources: [GG@13.1#2.5, BP@13.2#23, BP@13.3#23]
  - id: E-3
    title: "eine Aktualisierung nur in vorläufigen Kennzeichen 3 oder 4 ersetzt die frühere 61 nicht"
    description: >-
      Ändert eine aktualisierte 61 nur vorläufige Kennzeichen (KZ-AU 3, KZ-AK-AU 4), ersetzt sie die frühere 61
      nicht: die 01 bleibt, keine 88 und keine neue 01.
    kind: efz
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["61"]
    fields: [DBVO.KZ-AK-AU, DBVO.KZ-AU]
    params: []
    sources: [VB@13.3#3.12.4, VB@13.4#3.12.4, VB@13.3#3.12.12, VB@13.4#3.12.12]

  - id: E-4
    title: "gibt der Arbeitnehmer dieselbe Krankheit an, zählt der Arbeitgeber seine eigenen EFZ-Tage"
    description: >-
      Teilt der Arbeitnehmer mit, dass es sich um dieselbe Krankheit wie bei früheren Arbeitsunfähigkeiten handelt,
      zählt der Arbeitgeber die attestierten Tage dieser Zeiten innerhalb von 12 Monaten vor der aktuellen AU selbst
      (§ 3 EFZG). Sind die sechs Wochen verbraucht, gibt es keine Entgeltfortzahlung (DATUM-EGZBIS = Tag vor
      DATUM-AB), auch wenn die 61 keine Zeit als anrechenbar kennzeichnet (TA 167, dritte Runde: 11.06.2026).
    kind: efz
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["01"]
    fields: [DBAL.DATUM-EGZBIS]
    params: [efz_days]
    sources: [VB@13.3#3.12.5, VB@13.4#3.12.5]
  - id: E-5
    title: "die Entgeltfortzahlung endet spätestens mit dem Ende der Beschäftigung"
    description: >-
      DATUM-EGZBIS liegt nie nach dem Ende der Beschäftigung.
    kind: efz
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["01"]
    fields: [DBAL.DATUM-EGZBIS, DBAL.ENDE-BV-ZUM]
    params: []
    sources: [VB@13.3#3.4.3, VB@13.4#3.4.3]

