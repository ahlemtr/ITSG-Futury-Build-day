      14.07.2025, Hinweise; Beispielpapier 16.1). TA 167 (ITSG-Musterlösung, unverbindlich) setzt dagegen 12 Monate vor die früheste anrechenbare AU bzw. vor
      die aktuelle AU, wenn keine anrechenbar ist (Widerspruch, ITSG gefragt; als erwarteter Fehler gesperrt).
    kind: reply
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["61"]
    fields: [DBVO.12-MONATSFRIST-AB]
    params: []
    sources: [VB@13.3#3.12.5, VB@13.4#3.12.5, BP@13.2#16.1, BP@13.3#16.1, HINWEISE@1#chain]
