    description: >-
      Die Krankenkasse füllt DBVO.AU-AB-SV nur, wenn ihr Beginn der aktuellen Arbeitsunfähigkeit von AU-AB-AG
      abweicht; sonst Grundstellung (VB 3.12.3; Beispielpapier 16.1 und die Rückmeldungen zu TA 167 zeigen 00000000).
    kind: reply
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["61"]
    fields: [DBVO.AU-AB-SV]
    params: []
