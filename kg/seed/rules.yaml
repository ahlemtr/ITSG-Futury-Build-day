  - id: K61-7
    title: "KZ-AK-AU = 4, wenn die aktuelle AU-Bescheinigung fehlt, sonst 0"
    description: >-
      KZ-AK-AU = 4, wenn die aktuelle AU-Bescheinigung fehlt, sonst 0.
    kind: reply
    family: vorerkrankung
    status: approved
    criterion: null
    applies_to: ["61"]
