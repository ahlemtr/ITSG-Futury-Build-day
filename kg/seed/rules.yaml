# Rules of the engine.
# Sources cite the narrowest passage, in both VB versions where the text exists in both.
# BP, HINWEISE and BVORERK sources are optional: dropped with a warning if the file is missing.
rules:
  # --- when must the employer send a 41?
  - id: R41-1
    title: 41 only if the current AU and at least one prior AU are certified
    description: >-
      A 41 may only be sent if the current AU and at least one prior AU are certified (sick note:
      eAU or paper at the employer).
    kind: domain
    status: approved
    criterion: f41c7278-b5a5-4ec3-b321-39bca5c3aeeb
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: []
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BVORERK@1#f41c7278]
  - id: R41-2
    title: gap between current AU start and last prior AU end at most gap_months
    description: >-
      Start of the current AU minus the end of the last prior AU is at most gap_months. With
      gap_inclusive = true (13.4) a gap of exactly 6 months (next_start == prior_end + 6 months) still
      chains; with false (13.3) it does not.
    kind: domain
    status: approved
    criterion: 0cefe80e-4fd9-41e1-be4f-3ae1ecbde646
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, BVORERK@1#0cefe80e]
  - id: R41-3
    title: chain back while the gap to the next AU is at most gap_months (Daumenkriterium)
    description: >-
      Chain back: include a prior AU only while the gap to the next one is at most gap_months
      (Daumenkriterium), no time limit. Newest first; stop at the first gap larger than gap_months.
    kind: domain
    status: approved
    criterion: aade0289-e8f9-4e12-9c49-464cf6cd0789
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: [gap_months, gap_inclusive]
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining, VB@13.3#3.12.7, VB@13.4#3.12.7, BP@13.3#13.2, BVORERK@1#aade0289]
  - id: R41-4
    title: prior days in the last sum_window_months + current AU days at least min_total_days
    description: >-
      Prior days in the last sum_window_months plus the current AU days must be at least
      min_total_days.
    kind: domain
    status: approved
    criterion: 9c8c9b58-4d0f-4066-98ac-973095418d63
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU, DBVO.AU-AB-AG]
    params: [min_total_days, sum_window_months]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.3#13.4, BVORERK@1#9c8c9b58]
  - id: R41-5
    title: uncertified short absences (Kurz-AU) are never listed
    description: >-
      Uncertified short absences (Kurz-AU) are never listed, unless a certified AU follows seamlessly
      (then they belong to it; listing format: ask ITSG, 00 question 12).
    kind: domain
    status: approved
    criterion: null
    applies_to: ["41"]
    fields: [DBVO.BEGINN-AU, DBVO.ENDE-AU]
    params: []
    sources: [VB@13.3#3.12/chaining, VB@13.4#3.12/chaining]
  - id: R41-6
    title: open-ended current AU counts until report date + open_end_days - 1
    description: >-
      An open-ended current AU counts until report date + open_end_days - 1 (one week including the
      report date, BP 13.5: 02.09 -> 08.09).
    kind: domain
    status: approved
    criterion: null
    applies_to: ["41"]
    fields: [DBVO.AU-AB-AG]
    params: [open_end_days]
    sources: [VB@13.3#3.12/conditions, VB@13.4#3.12/conditions, BP@13.3#13.5]

