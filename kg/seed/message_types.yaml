# Data blocks per Abgabegrund: VB Anlage 3 13.3, chapter 2 (transcribed 2026-11-01, cell by cell from the PDF).
# J = the block must be present, m = only when the case calls for it, N = the block must not be present.
# DSLW is always J. The Anlage shows the regular case; it does not cover the exceptions for cancellations.
