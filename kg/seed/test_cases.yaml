# Test cases: facts and expected values
# Locked cases (locked: true) carry values typed in from their source document, each compared field with
# its source in expected_sources; the engine never recomputes them (tests/test_locked.py checks them).
# Other cases are recomputed with the rules engine.
# (recomputed with the rules engine). Years in the BP examples: XX = 2026, YY = 2025.
# steps: single = only the 41 decision is graded; chain = full message chain.
# Periods are listed newest first (F41-8). Hidden cases are in the graph like the others;
# the API decides what a vendor may see.
test_cases:
