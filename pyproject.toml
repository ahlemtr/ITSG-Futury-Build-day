[project]
name = "eel-review"
version = "0.1.0"
description = "DTA EEL test platform: rules engine, checker, test builder, knowledge graph and API"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dateutil",
    "python-docx",
    "pdfplumber",
    "neo4j",
    "openai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "jinja2",
    "cryptography",
    "python-multipart",
]

[project.optional-dependencies]
pdf = ["weasyprint"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["plan", "ui"]

[tool.ruff.lint.per-file-ignores]
"api/routes/*" = ["B008"]  # FastAPI File() / Form() defaults
