[project]
name = "eel-review"
version = "0.1.0"
description = "EEL review assistant: test builder and rule checker for DTA EEL (ITSG Futury Build Days)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pyyaml",
  "python-dateutil",
  "psycopg[binary]",
  "neo4j",
  "openai",
  "python-docx",
  "pdfplumber",
  "jinja2",
  "cryptography",
  "python-multipart",
  "python-dotenv",
]

[project.optional-dependencies]
pdf = ["weasyprint"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["plan"]

[tool.ruff.lint.per-file-ignores]
"api/routes/*" = ["B008"]  # FastAPI File() / Form() defaults
