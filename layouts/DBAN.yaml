notes:
- Not commented in the Verfahrensbeschreibung and not present in the TEEL0 sample. Positions, lengths, types and
  M/m from GG Anlage 1 (13.1.1); field names from Pflichtenheft Anlage 19 (2026.1, DBAN), which refers to Anlage 9.4
  of the joint circular "Meldeverfahren zur Sozialversicherung". Both sources agree on every position.
- VB Anlage 3 marks DBAN "m" on every code except 88 (sent only when the case calls for it).
- Address changes are only allowed through the DEÜV procedure (Pflichtenheft Anlage 19).
